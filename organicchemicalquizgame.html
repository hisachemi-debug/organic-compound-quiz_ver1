<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Organic Chem Quest | 有機化学構造・反応マスター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Noto+Sans+JP:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');

    :root {
      --bg-dark: #0a0f1d;
      --panel-bg: rgba(16, 24, 46, 0.88);
      --border-cyan: #06b6d4;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.15), transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #f8fafc;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      height: 100dvh;
      overflow: hidden;
    }

    .font-teko { font-family: 'Teko', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .cyber-panel {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(56, 189, 248, 0.05);
    }

    .btn-cyber {
      position: relative;
      transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-cyber:active {
      transform: scale(0.97);
    }

    .fever-glow {
      animation: feverPulse 1s infinite alternate;
    }
    @keyframes feverPulse {
      0% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); border-color: #ec4899; }
      100% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); border-color: #fbbf24; }
    }

    .chem-text {
      font-family: 'JetBrains Mono', 'Noto Sans JP', sans-serif;
      font-size: 14px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .chem-bond {
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .chem-bond-double {
      stroke: #38bdf8;
      stroke-width: 2;
    }
  </style>
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-xl mx-auto p-1.5 sm:p-3 relative overflow-hidden">

  <!-- TOP HUD -->
  <header class="flex items-center justify-between px-3 py-1.5 cyber-panel rounded-xl shrink-0 mb-1.5">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
      <span class="font-teko tracking-wider text-xl text-cyan-300">ORG-CHEM BATTLE</span>
    </div>
    <div class="flex items-center space-x-2 text-xs">
      <button id="soundToggleBtn" class="px-2 py-1 rounded bg-slate-800 border border-slate-600 text-slate-300 active:scale-95">
        🔊 <span id="soundLabel">ON</span>
      </button>
      <button id="navDexBtn" class="px-2.5 py-1 rounded bg-cyan-950 border border-cyan-500 text-cyan-300 font-bold active:scale-95">
        📖 図鑑 (<span id="dexCollectedCount">0</span>/36)
      </button>
    </div>
  </header>

  <!-- VIEW 1: タイトル・分野選択 -->
  <main id="titleView" class="flex-1 flex flex-col justify-between overflow-hidden cyber-panel rounded-2xl p-3 sm:p-4 text-center">
    <div class="shrink-0">
      <div class="inline-block px-3 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-500/50 text-cyan-300 text-[11px] font-mono tracking-widest mb-1">
        HIGH SCHOOL ORGANIC BATTLE
      </div>
      <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-100 to-indigo-300">
        有機構造式クエスト
      </h1>
      <p class="text-[11px] text-slate-400">高校基礎〜共通テスト：官能基・反応性完全マスター</p>
    </div>

    <!-- 分野セレクト -->
    <div class="my-auto py-1 w-full">
      <div class="text-[11px] font-bold text-cyan-400 text-left mb-1.5 flex items-center gap-1 px-1">
        <span>▼ 出題分野を選択</span>
      </div>
      <div class="grid grid-cols-2 gap-1.5 w-full">
        <button data-cat="all" class="cat-btn active-cat p-2.5 rounded-xl border text-left flex flex-col justify-center bg-cyan-950/60 border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.3)]">
          <div class="flex justify-between items-center w-full">
            <span class="text-xs font-bold text-white">⚡ 全分野ミックス</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-cyan-500 text-slate-900 font-bold">36種</span>
          </div>
          <span class="text-[10px] text-slate-300 mt-1 leading-tight">総合実戦トレーニング</span>
        </button>

        <button data-cat="aliphatic" class="cat-btn p-2.5 rounded-xl border text-left flex flex-col justify-center bg-slate-900/60 border-slate-700 text-slate-300">
          <div class="flex justify-between items-center w-full">
            <span class="text-xs font-bold text-white">🧪 脂肪族化合物</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-200">12種</span>
          </div>
          <span class="text-[10px] text-slate-400 mt-1 leading-tight">アルケン・アルキン・アルコール</span>
        </button>

        <button data-cat="aromatic" class="cat-btn p-2.5 rounded-xl border text-left flex flex-col justify-center bg-slate-900/60 border-slate-700 text-slate-300">
          <div class="flex justify-between items-center w-full">
            <span class="text-xs font-bold text-white">⌬ 芳香族化合物</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-200">15種</span>
          </div>
          <span class="text-[10px] text-slate-400 mt-1 leading-tight">ベンゼン環・フェノール類</span>
        </button>

        <button data-cat="oxygen" class="cat-btn p-2.5 rounded-xl border text-left flex flex-col justify-center bg-slate-900/60 border-slate-700 text-slate-300">
          <div class="flex justify-between items-center w-full">
            <span class="text-xs font-bold text-white">❄️ 酸素・窒素含有</span>
            <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-200">9種</span>
          </div>
          <span class="text-[10px] text-slate-400 mt-1 leading-tight">カルボン酸・エステル・アミン</span>
        </button>
      </div>
    </div>

    <!-- モード選択 -->
    <div class="space-y-1.5 shrink-0 w-full">
      <div class="grid grid-cols-2 gap-2">
        <button id="startSpeedBtn" class="btn-cyber p-2.5 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 font-bold text-white shadow-lg shadow-cyan-500/30 flex flex-col items-center">
          <span class="text-xs tracking-wider">SPEED ATTACK</span>
          <span class="text-[11px] font-normal opacity-90">10問タイム勝負</span>
        </button>
        <button id="startSurvivalBtn" class="btn-cyber p-2.5 rounded-xl bg-gradient-to-br from-purple-600 to-pink-600 font-bold text-white shadow-lg shadow-pink-500/30 flex flex-col items-center">
          <span class="text-xs tracking-wider">SURVIVAL</span>
          <span class="text-[11px] font-normal opacity-90">HP制エンドレス</span>
        </button>
      </div>
      <div class="text-[10px] text-slate-400 font-mono">
        HIGH SCORE: <span id="titleHighScore" class="text-cyan-300 font-bold">0</span> | BEST COMBO: <span id="titleBestCombo" class="text-amber-300 font-bold">0</span>
      </div>
    </div>
  </main>

  <!-- VIEW 2: バトル画面 (1画面完全固定) -->
  <main id="battleView" class="hidden flex-1 flex flex-col justify-between overflow-hidden cyber-panel rounded-2xl p-2 sm:p-3 relative">
    
    <!-- HUD -->
    <div class="flex items-center justify-between text-xs font-mono shrink-0 px-1">
      <div class="flex items-center gap-1.5">
        <span id="questionTypeBadge" class="px-2 py-0.5 rounded bg-cyan-950 border border-cyan-500 text-cyan-300 text-[10px] font-bold">
          構造 ➔ 性質・反応
        </span>
        <span id="feverBadge" class="hidden px-1.5 py-0.5 rounded bg-pink-600 font-black text-[10px] text-white animate-bounce">
          🔥 FEVER x2
        </span>
      </div>
      <div class="flex items-center gap-3">
        <div id="hpContainer" class="flex gap-1"></div>
        <div class="text-right">
          <span class="text-[10px] text-slate-400">SCORE</span>
          <span id="scoreVal" class="text-sm font-bold text-cyan-300 ml-1">0</span>
        </div>
      </div>
    </div>

    <!-- タイマーバー -->
    <div class="w-full bg-slate-800/80 rounded-full h-1.5 overflow-hidden my-1 shrink-0">
      <div id="timerBar" class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 w-full transition-all duration-100 ease-linear"></div>
    </div>

    <!-- 問題文 & 構造式提示領域 -->
    <div class="flex-1 flex flex-col items-center justify-center min-h-0 py-0.5 text-center w-full px-1">
      <h2 id="questionPrompt" class="w-full text-xs sm:text-sm font-bold text-slate-100 mb-1 leading-snug break-words">
        <!-- JSで挿入 -->
      </h2>

      <div id="questionSvgContainer" class="w-full max-w-[190px] h-24 sm:h-28 flex items-center justify-center bg-slate-900/90 rounded-xl border border-slate-700/80 p-1 shadow-inner relative">
        <svg id="questionSvg" class="w-full h-full object-contain" viewBox="0 0 180 180"></svg>
        <span id="questionFormula" class="absolute bottom-1 right-2 text-[9px] font-mono text-slate-400/80"></span>
      </div>
    </div>

    <!-- 4択選択肢グリッド (2行×2列) -->
    <div id="optionsGrid" class="grid grid-cols-2 gap-1.5 sm:gap-2 shrink-0 h-[48%] sm:h-[50%] w-full">
      <!-- JSで4つのボタンを生成 -->
    </div>

    <!-- 解説トースト -->
    <div id="answerFeedbackModal" class="hidden absolute inset-0 z-30 bg-slate-950/90 backdrop-blur-md rounded-2xl p-3 flex flex-col items-center justify-between text-center">
      <div id="feedbackIcon" class="text-3xl my-auto">⭕</div>
      <div class="w-full px-1">
        <h3 id="feedbackTitle" class="text-base font-black mb-1"></h3>
        <p id="feedbackDesc" class="text-xs text-slate-300 leading-relaxed bg-slate-900/90 p-2.5 rounded-xl border border-slate-700/80 max-h-28 overflow-y-auto text-left"></p>
      </div>
      <button id="feedbackNextBtn" class="w-full py-2.5 mt-2 rounded-xl bg-cyan-500 font-bold text-slate-950 text-sm active:scale-95 shadow-lg shadow-cyan-500/40">
        次へ進む (NEXT) ➔
      </button>
    </div>
  </main>

  <!-- VIEW 3: リザルト画面 -->
  <main id="resultView" class="hidden flex-1 flex flex-col justify-between overflow-hidden cyber-panel rounded-2xl p-4 text-center">
    <div class="shrink-0">
      <span class="text-xs font-mono text-cyan-400">OPERATION COMPLETED</span>
      <h2 class="text-2xl font-black text-white mt-1">バトル終了！</h2>
    </div>

    <div class="my-auto space-y-2 py-2">
      <div class="text-4xl font-teko font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-pink-400" id="resultScore">
        0 PTS
      </div>
      <div class="text-xs font-bold text-slate-300" id="resultTitleGrade">称号: 研修研究員</div>

      <div class="grid grid-cols-2 gap-2 text-xs font-mono max-w-xs mx-auto pt-2">
        <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400">正解率</div>
          <div id="resultAccuracy" class="text-sm font-bold text-cyan-300">0%</div>
        </div>
        <div class="bg-slate-900/80 p-2 rounded-xl border border-slate-800">
          <div class="text-[10px] text-slate-400">最大コンボ</div>
          <div id="resultCombo" class="text-sm font-bold text-pink-400">0</div>
        </div>
      </div>
    </div>

    <div class="space-y-1.5 shrink-0 w-full">
      <button id="resultRetryBtn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 font-bold text-white text-sm active:scale-95 shadow-md shadow-cyan-500/30">
        🔄 もう一度挑戦する
      </button>
      <button id="resultHomeBtn" class="w-full py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 font-bold text-xs active:scale-95">
        🏠 タイトルへ戻る
      </button>
    </div>
  </main>

  <!-- VIEW 4: 分子図鑑（Dex）モーダル -->
  <div id="dexModal" class="hidden fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md p-3 flex flex-col justify-between">
    <div class="flex items-center justify-between pb-2 border-b border-slate-800 shrink-0">
      <h3 class="text-base font-bold text-cyan-300 flex items-center gap-1.5">
        <span>📖</span> 分子図鑑 (CHEMICAL CODEX)
      </h3>
      <button id="dexCloseBtn" class="text-slate-400 hover:text-white px-2 py-1 text-sm font-bold">✕ 閉じる</button>
    </div>

    <div class="flex gap-1 py-1.5 overflow-x-auto text-[11px] shrink-0 font-bold" id="dexTabs">
      <button data-filter="all" class="dex-tab active-dex px-2.5 py-1 rounded bg-cyan-500 text-slate-900 shrink-0">すべて (36)</button>
      <button data-filter="aliphatic" class="dex-tab px-2.5 py-1 rounded bg-slate-800 text-slate-300 shrink-0">脂肪族</button>
      <button data-filter="aromatic" class="dex-tab px-2.5 py-1 rounded bg-slate-800 text-slate-300 shrink-0">芳香族</button>
      <button data-filter="oxygen" class="dex-tab px-2.5 py-1 rounded bg-slate-800 text-slate-300 shrink-0">酸素・窒素</button>
    </div>

    <div id="dexList" class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pr-1 my-1"></div>
  </div>

  <script>
    /* ==========================================================
       1. 高校化学36化合物 完全データベース（ケクレ表記・教科書準拠）
       ========================================================== */
    const COMPOUNDS = [
      // 脂肪族 (12)
      { id: 'methane', name: 'メタン', formula: 'CH4', cat: 'aliphatic', desc: '最も単純なアルカン。正四面体構造。塩素と光照射で段階的に置換反応。',
        svg: `<text x="90" y="90" class="chem-text">C</text>
              <line x1="90" y1="78" x2="90" y2="48" class="chem-bond"/><text x="90" y="38" class="chem-text">H</text>
              <line x1="90" y1="102" x2="90" y2="132" class="chem-bond"/><text x="90" y="142" class="chem-text">H</text>
              <line x1="78" y1="90" x2="48" y2="90" class="chem-bond"/><text x="38" y="90" class="chem-text">H</text>
              <line x1="102" y1="90" x2="132" y2="90" class="chem-bond"/><text x="142" y="90" class="chem-text">H</text>` },
      { id: 'ethene', name: 'エチレン (エテン)', formula: 'C2H4', cat: 'aliphatic', desc: '二重結合をもつ最も単純なアルケン。臭素水を脱色する。付加重合でポリエチレン。',
        svg: `<text x="70" y="90" class="chem-text">C</text><text x="110" y="90" class="chem-text">C</text>
              <line x1="80" y1="86" x2="100" y2="86" class="chem-bond-double"/><line x1="80" y1="94" x2="100" y2="94" class="chem-bond-double"/>
              <line x1="60" y1="80" x2="42" y2="62" class="chem-bond"/><text x="34" y="54" class="chem-text">H</text>
              <line x1="60" y1="100" x2="42" y2="118" class="chem-bond"/><text x="34" y="126" class="chem-text">H</text>
              <line x1="120" y1="80" x2="138" y2="62" class="chem-bond"/><text x="146" y="54" class="chem-text">H</text>
              <line x1="120" y1="100" x2="138" y2="118" class="chem-bond"/><text x="146" y="126" class="chem-text">H</text>` },
      { id: 'ethyne', name: 'アセチレン (エチン)', formula: 'C2H2', cat: 'aliphatic', desc: '三重結合をもつ直線状分子。カーバイドに水を加えて発生。銀アセチリド白沈を生じる。',
        svg: `<text x="40" y="90" class="chem-text">H</text><line x1="50" y1="90" x2="70" y2="90" class="chem-bond"/>
              <text x="80" y="90" class="chem-text">C</text>
              <line x1="90" y1="84" x2="110" y2="84" class="chem-bond"/><line x1="90" y1="90" x2="110" y2="90" class="chem-bond"/><line x1="90" y1="96" x2="110" y2="96" class="chem-bond"/>
              <text x="120" y="90" class="chem-text">C</text><line x1="130" y1="90" x2="150" y2="90" class="chem-bond"/><text x="160" y="90" class="chem-text">H</text>` },
      { id: 'propene', name: 'プロペン', formula: 'C3H6', cat: 'aliphatic', desc: '水を付加させるとマルコフニコフ則に従い主生成物として2-プロパノールが得られる。臭素水脱色。',
        svg: `<text x="45" y="90" class="chem-text">H3C</text><line x1="65" y1="90" x2="85" y2="90" class="chem-bond"/>
              <text x="95" y="90" class="chem-text">CH</text>
              <line x1="107" y1="86" x2="125" y2="86" class="chem-bond"/><line x1="107" y1="94" x2="125" y2="94" class="chem-bond"/>
              <text x="142" y="90" class="chem-text">CH2</text>` },
      { id: 'methanol', name: 'メタノール', formula: 'CH4O', cat: 'aliphatic', desc: '第1級アルコール。有毒（失明危険）。Naと反応してH2発生。酸化するとホルムアルデヒド、さらにギ酸へ。',
        svg: `<text x="50" y="90" class="chem-text">H3C</text><line x1="75" y1="90" x2="115" y2="90" class="chem-bond"/><text x="135" y="90" class="chem-text" fill="#f87171">OH</text>` },
      { id: 'ethanol', name: 'エタノール', formula: 'C2H6O', cat: 'aliphatic', desc: '第1級アルコール。Naと反応してH2発生。CH3-CH(OH)-をもつためヨードホルム反応陽性。酸化でアセトアルデヒド。',
        svg: `<text x="40" y="90" class="chem-text">H3C</text><line x1="62" y1="90" x2="90" y2="90" class="chem-bond"/>
              <text x="105" y="90" class="chem-text">CH2</text><line x1="120" y1="90" x2="140" y2="90" class="chem-bond"/>
              <text x="155" y="90" class="chem-text" fill="#f87171">OH</text>` },
      { id: 'isopropanol', name: '2-プロパノール', formula: 'C3H8O', cat: 'aliphatic', desc: '第2級アルコール。Naと反応してH2発生。酸化するとアセトンを生じる。ヨードホルム反応陽性。',
        svg: `<text x="90" y="90" class="chem-text">CH</text>
              <line x1="90" y1="78" x2="90" y2="52" class="chem-bond"/><text x="90" y="42" class="chem-text" fill="#f87171">OH</text>
              <line x1="75" y1="95" x2="48" y2="108" class="chem-bond"/><text x="35" y="115" class="chem-text">H3C</text>
              <line x1="105" y1="95" x2="132" y2="108" class="chem-bond"/><text x="145" y="115" class="chem-text">CH3</text>` },
      { id: 'secbutanol', name: '2-ブタノール', formula: 'C4H10O', cat: 'aliphatic', desc: '不斉炭素原子をもち鏡像異性体が存在。第2級アルコールでNaと反応してH2発生。酸化でMEK。ヨードホルム陽性。',
        svg: `<text x="85" y="90" class="chem-text">CH</text>
              <line x1="85" y1="78" x2="85" y2="52" class="chem-bond"/><text x="85" y="42" class="chem-text" fill="#f87171">OH</text>
              <line x1="70" y1="90" x2="48" y2="90" class="chem-bond"/><text x="35" y="90" class="chem-text">H3C</text>
              <line x1="102" y1="90" x2="125" y2="90" class="chem-bond"/><text x="146" y="90" class="chem-text">C2H5</text>` },
      { id: 'ethylene_glycol', name: 'エチレングリコール', formula: 'C2H6O2', cat: 'aliphatic', desc: '2価アルコール。Naと反応してH2発生。自動車不凍液。テレフタル酸と縮合重合してポリエチレンテレフタラート。',
        svg: `<text x="65" y="90" class="chem-text">CH2</text><line x1="85" y1="90" x2="105" y2="90" class="chem-bond"/><text x="125" y="90" class="chem-text">CH2</text>

    /* ==========================================================
       3. 音声エンジン (Tone.js)
       ========================================================== */
    let synth = null;
    let isSoundOn = true;

    function initAudio() {
      if (!synth && window.Tone) {
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.005, decay: 0.1, sustain: 0.05, release: 0.1 }
        }).toDestination();
        Tone.start();
      }
    }

    function playSfx(type) {
      if (!isSoundOn || !synth) return;
      try {
        const now = Tone.now();
        if (type === 'correct') {
          synth.triggerAttackRelease(['C5', 'G5'], '16n', now);
        } else if (type === 'wrong') {
          synth.triggerAttackRelease(['F3', 'B2'], '8n', now);
        } else if (type === 'fever') {
          synth.triggerAttackRelease(['C5', 'E5', 'G5', 'C6'], '16n', now);
        } else if (type === 'tick') {
          synth.triggerAttackRelease('A5', '32n', now, 0.2);
        }
      } catch(e) {}
    }

    /* ==========================================================
       4. ゲームステート
       ========================================================== */
    let currentCategory = 'all';
    let currentMode = 'speed';
    let qIndex = 0;
    let totalQuestions = 10;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let hp = 3;
    let isFever = false;
    let timerId = null;
    let timeLeft = 15;
    let currentQuiz = null;
    let isAnswering = false;

    let unlockedCompounds = JSON.parse(localStorage.getItem('org_chem_unlocked') || '[]');
    let highScore = parseInt(localStorage.getItem('org_chem_hiscore') || '0');
    let bestComboEver = parseInt(localStorage.getItem('org_chem_bestcombo') || '0');

    /* ==========================================================
       5. DOM要素
       ========================================================== */
    const titleView = document.getElementById('titleView');

    /* ==========================================================
       6. イベント初期設定
       ========================================================== */
    function updateDexStats() {
      dexCollectedCount.textContent = unlockedCompounds.length;
      titleHighScore.textContent = highScore;
      titleBestCombo.textContent = bestComboEver;
    }

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.classList.remove('active-cat', 'border-cyan-400', 'bg-cyan-950/60', 'shadow-[0_0_12px_rgba(6,182,212,0.3)]');
          b.classList.add('border-slate-700', 'bg-slate-900/60');
        });
        btn.classList.add('active-cat', 'border-cyan-400', 'bg-cyan-950/60', 'shadow-[0_0_12px_rgba(6,182,212,0.3)]');
        btn.classList.remove('border-slate-700', 'bg-slate-900/60');
        currentCategory = btn.dataset.cat;
      });
    });

    soundToggleBtn.addEventListener('click', () => {
      initAudio();
      isSoundOn = !isSoundOn;
      soundLabel.textContent = isSoundOn ? 'ON' : 'OFF';
      soundToggleBtn.classList.toggle('text-cyan-300', isSoundOn);
    });

    document.getElementById('startSpeedBtn').addEventListener('click', () => startGame('speed'));
    document.getElementById('startSurvivalBtn').addEventListener('click', () => startGame('survival'));
    document.getElementById('resultRetryBtn').addEventListener('click', () => startGame(currentMode));

    document.getElementById('dexCloseBtn').addEventListener('click', () => dexModal.classList.add('hidden'));

    /* ==========================================================
       7. 双方向出題ロジック
       ========================================================== */
    function startGame(mode) {
      initAudio();
      currentMode = mode;
      qIndex = 0;
      score = 0;
      combo = 0;
      maxCombo = 0;
      hp = 3;
      isFever = false;
      totalQuestions = (mode === 'speed') ? 10 : 999;

      titleView.classList.add('hidden');
      resultView.classList.add('hidden');
      battleView.classList.remove('hidden');

      renderHp();
      scoreVal.textContent = '0';
      feverBadge.classList.add('hidden');

      loadQuestion();
    }

    function renderHp() {
      if (currentMode === 'survival') {
        hpContainer.innerHTML = Array(3).fill(0).map((_, i) => 
          `<span class="text-sm ${i < hp ? 'text-rose-500' : 'text-slate-600'}">❤️</span>`
        ).join('');
      } else {
        hpContainer.innerHTML = `<span class="text-[10px] text-cyan-400 font-bold">第 ${qIndex + 1}/${totalQuestions} 問</span>`;
      }
    }

    function getEligiblePool() {
      if (currentCategory === 'all') return COMPOUNDS;
      return COMPOUNDS.filter(c => c.cat === currentCategory);
    }

    function generateQuestion() {
      const pool = getEligiblePool();
      const pattern = Math.random();

      // パターンA: 【反応 ➔ 該当する構造式を選ぶ】 (35%)
      if (pattern < 0.35) {
        const availableRules = REACTION_RULES.filter(r => pool.some(c => r.isPositive(c)));
        if (availableRules.length > 0) {
          const rule = availableRules[Math.floor(Math.random() * availableRules.length)];
          const correctPool = pool.filter(c => rule.isPositive(c));
          const correct = correctPool[Math.floor(Math.random() * correctPool.length)];

          const wrongPool = pool.filter(c => !rule.isPositive(c));
          const shuffledWrong = wrongPool.sort(() => 0.5 - Math.random()).slice(0, 3);
          const options = [correct, ...shuffledWrong].sort(() => 0.5 - Math.random());

          return {
            modeType: 'react_to_struct',
            badge: rule.badge,
            prompt: rule.questionText,
            targetCompound: correct,
            options: options,
            isStructureChoice: true,
            desc: rule.desc
          };
        }
      }

      // パターンB: 【構造・化合物 ➔ 起こる反応を選ぶ】 (35%)
      if (pattern < 0.70) {
        const validCompounds = pool.filter(c => REACTION_RULES.some(r => r.isPositive(c)));
        const target = validCompounds[Math.floor(Math.random() * validCompounds.length)];
        const correctRules = REACTION_RULES.filter(r => r.isPositive(target));
        const correctRule = correctRules[Math.floor(Math.random() * correctRules.length)];

        const wrongRules = REACTION_RULES.filter(r => !r.isPositive(target));
        const shuffledWrongRules = wrongRules.sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [correctRule, ...shuffledWrongRules].sort(() => 0.5 - Math.random());

        return {
          modeType: 'struct_to_react',
          badge: '構造 ➔ 反応性判定',
          prompt: `「${target.name}」(${target.formula}) が示す性質・反応として【正しいもの】はどれか？`,
          targetCompound: target,
          correctRule: correctRule,
          options: options,
          isStructureChoice: false,
          isRuleOption: true,
          desc: `${correctRule.name}：${correctRule.desc}`
        };
      }

      // パターンC: 【構造式 ➔ 名称を当てる】 (15%)
      if (pattern < 0.85) {
        const correct = pool[Math.floor(Math.random() * pool.length)];
        const wrongChoices = pool.filter(c => c.id !== correct.id).sort(() => 0.5 - Math.random()).slice(0, 3);
        const options = [correct, ...wrongChoices].sort(() => 0.5 - Math.random());

        return {
          modeType: 'struct_to_name',
          badge: '構造 ➔ 化合物名',
          prompt: 'この構造式をもつ化合物の正確な名称はどれか？',
          targetCompound: correct,
          options: options,
          isStructureChoice: false,
          isRuleOption: false,
          desc: correct.desc
        };
      }

      // パターンD: 【名称・特徴 ➔ 構造式を選ぶ】 (15%)
      const correct = pool[Math.floor(Math.random() * pool.length)];
      const wrongChoices = pool.filter(c => c.id !== correct.id).sort(() => 0.5 - Math.random()).slice(0, 3);
      const options = [correct, ...wrongChoices].sort(() => 0.5 - Math.random());

      return {
        modeType: 'name_to_struct',
        badge: '名称 ➔ 構造式',
        prompt: `「${correct.name}」(${correct.formula}) の正確な構造式を選べ！`,
        targetCompound: correct,
        options: options,
        isStructureChoice: true,
        desc: correct.desc
      };
    }

    function loadQuestion() {
      if (currentMode === 'speed' && qIndex >= totalQuestions) {
        endGame();
        return;
      }
      if (currentMode === 'survival' && hp <= 0) {
        endGame();
        return;
      }

      isAnswering = false;
      renderHp();
      currentQuiz = generateQuestion();

      questionTypeBadge.textContent = currentQuiz.badge;
      questionPrompt.textContent = currentQuiz.prompt;

      // 構造式上部提示が必要な形式か判定
      if (!currentQuiz.isStructureChoice) {
        questionSvgContainer.classList.remove('hidden');
        questionSvg.innerHTML = currentQuiz.targetCompound.svg;
        questionFormula.textContent = currentQuiz.targetCompound.formula;
      } else {
        questionSvgContainer.classList.add('hidden');
      }

      // 4択グリッドの生成
      optionsGrid.innerHTML = '';
      currentQuiz.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-cyber flex flex-col items-center justify-center p-1 sm:p-2 rounded-xl bg-slate-900/90 border border-slate-700/80 hover:border-cyan-400 active:scale-95 transition-all w-full h-full relative overflow-hidden';

        if (currentQuiz.isStructureChoice) {
          // 4つの構造式から選ぶ
          btn.innerHTML = `
            <div class="w-full h-[75%] flex items-center justify-center pointer-events-none">
              <svg viewBox="0 0 180 180" class="w-full h-full object-contain">${opt.svg}</svg>
            </div>
            <span class="text-[10px] font-mono text-cyan-300/80 mt-0.5 tracking-wider">${opt.formula}</span>
          `;
          btn.addEventListener('click', () => handleAnswer(opt.id, opt));
        } else if (currentQuiz.isRuleOption) {
          // 4つの反応・性質文から選ぶ
          btn.innerHTML = `
            <span class="text-xs sm:text-sm font-bold text-white leading-snug px-1 line-clamp-3 text-center">${opt.name}</span>
          `;
          btn.addEventListener('click', () => handleAnswer(opt.id, opt));
        } else {
          // 4つの名称から選ぶ
          btn.innerHTML = `
            <span class="text-sm sm:text-base font-bold text-white leading-snug px-1 w-full truncate text-center">${opt.name}</span>
            <span class="text-[11px] font-mono text-cyan-300/80 mt-0.5">${opt.formula}</span>
          `;
          btn.addEventListener('click', () => handleAnswer(opt.id, opt));
        }

        optionsGrid.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerId);
      timeLeft = 15;
      timerBar.style.width = '100%';
      timerBar.classList.remove('from-rose-500', 'to-amber-500');
      timerBar.classList.add('from-cyan-400', 'to-emerald-400');

      const totalTime = 15;
      const interval = 100;

      timerId = setInterval(() => {
        timeLeft -= interval / 1000;
        const pct = Math.max(0, (timeLeft / totalTime) * 100);
        timerBar.style.width = `${pct}%`;

        if (timeLeft <= 4) {
          timerBar.classList.remove('from-cyan-400', 'to-emerald-400');
          timerBar.classList.add('from-rose-500', 'to-amber-500');
          playSfx('tick');
        }

        if (timeLeft <= 0) {
          clearInterval(timerId);
          handleAnswer(null, null);
        }
      }, interval);
    }

    function handleAnswer(selectedId, selectedOpt) {
      if (isAnswering) return;
      isAnswering = true;
      clearInterval(timerId);

      let isCorrect = false;
      if (currentQuiz.isRuleOption) {
        isCorrect = (selectedId === currentQuiz.correctRule.id);
      } else {
        isCorrect = (selectedId === currentQuiz.targetCompound.id);
      }

      if (isCorrect) {
        playSfx('correct');
        combo++;
        if (combo > maxCombo) maxCombo = combo;

        if (combo >= 4) {
          if (!isFever) playSfx('fever');
          isFever = true;
          feverBadge.classList.remove('hidden');
          battleView.classList.add('fever-glow');
        }

        const timeBonus = Math.floor(timeLeft * 25);
        const added = (300 + timeBonus) * (isFever ? 2 : 1);
        score += added;
        scoreVal.textContent = score;

        if (!unlockedCompounds.includes(currentQuiz.targetCompound.id)) {
          unlockedCompounds.push(currentQuiz.targetCompound.id);
          localStorage.setItem('org_chem_unlocked', JSON.stringify(unlockedCompounds));
          updateDexStats();
        }

        feedbackIcon.textContent = '⭕ CORRECT!';
        feedbackTitle.className = 'text-base font-black text-cyan-400';
        feedbackTitle.textContent = currentQuiz.isRuleOption 
          ? `${currentQuiz.correctRule.name}（正解）` 
          : `${currentQuiz.targetCompound.name}（正解）`;
      } else {
        playSfx('wrong');
        combo = 0;
        isFever = false;
        feverBadge.classList.add('hidden');
        battleView.classList.remove('fever-glow');

        if (currentMode === 'survival') {
          hp--;
          renderHp();
        }

        feedbackIcon.textContent = (selectedId === null) ? '⏳ TIME OVER!' : '❌ INCORRECT...';
        feedbackTitle.className = 'text-base font-black text-rose-400';
        feedbackTitle.textContent = currentQuiz.isRuleOption 
          ? `正解: ${currentQuiz.correctRule.name}` 
          : `正解: ${currentQuiz.targetCompound.name}`;
      }

      feedbackDesc.textContent = currentQuiz.desc;
      answerFeedbackModal.classList.remove('hidden');
    }

    function nextQuestion() {
      answerFeedbackModal.classList.add('hidden');
      qIndex++;
      loadQuestion();
    }

    function endGame() {
      clearInterval(timerId);
      battleView.classList.add('hidden');
      resultView.classList.remove('hidden');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('org_chem_hiscore', highScore.toString());
      }
      if (maxCombo > bestComboEver) {
        bestComboEver = maxCombo;
        localStorage.setItem('org_chem_bestcombo', bestComboEver.toString());
      }
      updateDexStats();

      document.getElementById('resultScore').textContent = `${score} PTS`;
      document.getElementById('resultCombo').textContent = maxCombo;
      const acc = (currentMode === 'speed') ? Math.round((score / 6000) * 100) : '--';
      document.getElementById('resultAccuracy').textContent = `${Math.min(100, Math.max(10, acc))}%`;

      let title = '見習い研究員';
      if (score >= 5000) title = '🧪 ノーベル化学賞級 主任研究員';
      else if (score >= 3500) title = '⌬ 有機合成スペシャリスト';
      else if (score >= 2000) title = '📘 共通テスト満点レベル';
      document.getElementById('resultTitleGrade').textContent = `称号: ${title}`;
    }

    function showTitle() {
      clearInterval(timerId);
      resultView.classList.add('hidden');
      battleView.classList.add('hidden');
      titleView.classList.remove('hidden');
      updateDexStats();
    }

    /* ==========================================================
       8. 分子図鑑（Dex）
       ========================================================== */
    function openDex() {
      renderDexItems('all');
      dexModal.classList.remove('hidden');
    }

    function renderDexItems(filter) {
      const dexList = document.getElementById('dexList');
      dexList.innerHTML = '';

      const list = (filter === 'all') ? COMPOUNDS : COMPOUNDS.filter(c => c.cat === filter);

      list.forEach(c => {
        const isUnlocked = unlockedCompounds.includes(c.id);
        const card = document.createElement('div');
        card.className = `p-2 rounded-xl border flex flex-col justify-between ${
          isUnlocked 
            ? 'bg-slate-900/90 border-cyan-500/40 text-slate-100' 
            : 'bg-slate-950/70 border-slate-800 text-slate-600 opacity-60'
        }`;

        if (isUnlocked) {
          card.innerHTML = `
            <div class="h-24 flex items-center justify-center p-1 bg-slate-950/50 rounded-lg">
              <svg viewBox="0 0 180 180" class="w-full h-full object-contain">${c.svg}</svg>
            </div>
            <div class="mt-1">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-bold text-cyan-300">${c.name}</span>
                <span class="text-[10px] font-mono text-slate-400">${c.formula}</span>
              </div>
              <p class="text-[10px] text-slate-300 leading-snug mt-1 max-h-12 overflow-y-auto">${c.desc}</p>
            </div>
          `;
        } else {
          card.innerHTML = `
            <div class="h-24 flex flex-col items-center justify-center text-slate-600">
              <span class="text-2xl">🔒</span>
              <span class="text-[10px] font-mono mt-1">LOCKED</span>
            </div>
            <div class="mt-1 text-center">
              <span class="text-xs font-mono text-slate-500">??? (${c.formula})</span>
            </div>
          `;
        }

        dexList.appendChild(card);
      });
    }

    document.querySelectorAll('.dex-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.dex-tab').forEach(t => {
          t.classList.remove('bg-cyan-500', 'text-slate-900');
          t.classList.add('bg-slate-800', 'text-slate-300');
        });
        tab.classList.add('bg-cyan-500', 'text-slate-900');
        tab.classList.remove('bg-slate-800', 'text-slate-300');
        renderDexItems(tab.dataset.filter);
      });
    });

    updateDexStats();
  </script>
</body>
</html>
